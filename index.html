<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXTHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: #fff;
}

header {
    background: #171a23;
    border-bottom: 1px solid #292d38;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: #aeb4c0;
}

.auth {
    position: absolute;
    top: 20px;
    right: 20px;
}

button,
.download {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

.search {
    text-align: center;
    padding: 25px;
}

.search input {
    width: 90%;
    max-width: 650px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #343947;
    background: #191c25;
    color: white;
    font-size: 16px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
}

.card {
    background: #181b24;
    border: 1px solid #292e3a;
    border-radius: 15px;
    padding: 20px;
}

.card h3 {
    margin-top: 0;
}

.card p {
    color: #aeb4c0;
    line-height: 1.5;
}

.info {
    display: flex;
    justify-content: space-between;
    color: #aeb4c0;
    margin: 15px 0;
}

.download {
    display: block;
    text-align: center;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 420px;
    background: #181b24;
    border: 1px solid #292e3a;
    border-radius: 15px;
    padding: 25px;
}

.modal-box input {
    width: 100%;
    margin: 8px 0;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #343947;
    background: #10131a;
    color: white;
}

.modal-box button {
    width: 100%;
    margin-top: 10px;
}

.close {
    float: right;
    cursor: pointer;
    color: #aeb4c0;
}

footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 50px;
    color: #777e8d;
}
</style>
</head>

<body>

<header>
    <div class="auth">
        <button onclick="openAuth()">Zaloguj / Rejestracja</button>
    </div>

    <h1>TXTHub</h1>
    <p>Darmowa biblioteka plików TXT</p>
</header>

<div class="search">
    <input
        id="searchInput"
        type="text"
        placeholder="Szukaj plików..."
        oninput="searchFiles()"
    >
</div>

<main class="container">

<h2>Najnowsze pliki</h2>

<div class="files" id="fileList">

<div class="card">
    <h3>Better Bed Wars</h3>

    <p>
        Popularny texture pack do Minecraft BedWars.
        Lepsza czytelność i wygodniejsza gra.
    </p>

    <div class="info">
        <span>🥔 5.0</span>
        <span>⬇️ 0 pobrań</span>
    </div>

    <a
        class="download"
        href="Better%20Bed%20Wars.zip"
        download
    >
        ⬇️ Pobierz
    </a>
</div>

</div>

</main>

<div class="modal" id="authModal">
    <div class="modal-box">

        <span class="close" onclick="closeAuth()">✕</span>

        <h2 id="authTitle">Logowanie</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Hasło"
        >

        <button onclick="login()">
            Zaloguj
        </button>

        <button onclick="register()">
            Załóż konto
        </button>

        <p id="authMessage"></p>

    </div>
</div>

<footer>
    © 2026 TXTHub
</footer>

<script>

function searchFiles() {

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    document
    .querySelectorAll(".card")
    .forEach(card => {

        card.style.display =
            card.innerText
            .toLowerCase()
            .includes(search)
            ? "block"
            : "none";

    });
}

function openAuth() {
    document.getElementById("authModal").style.display = "flex";
}

function closeAuth() {
    document.getElementById("authModal").style.display = "none";
}

function login() {
    document.getElementById("authMessage").textContent =
        "Logowanie podłączymy w następnym kroku.";
}

function register() {
    document.getElementById("authMessage").textContent =
        "Rejestrację podłączymy w następnym kroku.";
}

</script>

</body>
</html>
