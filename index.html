<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXTHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

header {
    background: #171a23;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #292d38;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    color: #aeb4c0;
}

.search {
    padding: 25px 15px;
    text-align: center;
}

.search input {
    width: 90%;
    max-width: 650px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #343947;
    background: #191c25;
    color: white;
    font-size: 16px;
    outline: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.section-title {
    margin-bottom: 20px;
    font-size: 24px;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
}

.card {
    background: #181b24;
    border: 1px solid #292e3a;
    border-radius: 14px;
    padding: 20px;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #5865f2;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #aeb4c0;
    margin-bottom: 15px;
}

.info {
    display: flex;
    justify-content: space-between;
    color: #9da4b2;
    font-size: 14px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

footer {
    text-align: center;
    padding: 35px 15px;
    margin-top: 50px;
    color: #777e8d;
    border-top: 1px solid #292d38;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 27px;
    }

    .container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>TXTHub</h1>
    <p>Darmowa biblioteka plików TXT</p>
</header>

<div class="search">
    <input type="text" id="searchInput" placeholder="🔎 Szukaj plików TXT..." onkeyup="searchFiles()">
</div>

<main class="container">
    <h2 class="section-title">Najnowsze pliki</h2>

    <div class="files" id="fileList">

        <div class="card">
            <h3>Przykładowy TXT</h3>
            <p>To jest przykładowy plik dodany do TXTHub.</p>

            <div class="info">
                <span>⭐ 5.0</span>
                <span>⬇️ 0 pobrań</span>
            </div>

            <button onclick="alert('Plik będzie dostępny po dodaniu go do biblioteki.')">
                Pobierz TXT
            </button>
        </div>

        <div class="card">
            <h3>Lista przykładowa</h3>
            <p>Przykładowy opis pliku tekstowego.</p>

            <div class="info">
                <span>⭐ 4.8</span>
                <span>⬇️ 0 pobrań</span>
            </div>

            <button onclick="alert('Plik będzie dostępny po dodaniu go do biblioteki.')">
                Pobierz TXT
            </button>
        </div>

    </div>
</main>

<footer>
    © 2026 TXTHub
</footer>

<script>
function searchFiles() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const text = card.innerText.toLowerCase();

        if (text.includes(input)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
