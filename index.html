<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXTHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

header {
    padding: 35px 20px;
    text-align: center;
    background: #171a23;
    border-bottom: 1px solid #292d38;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: #aeb4c0;
}

.search {
    text-align: center;
    padding: 25px;
}

.search input {
    width: 90%;
    max-width: 650px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #343947;
    background: #191c25;
    color: white;
    font-size: 16px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
}

.card {
    background: #181b24;
    border: 1px solid #292e3a;
    border-radius: 15px;
    padding: 20px;
}

.card h3 {
    margin-top: 0;
}

.card p {
    color: #aeb4c0;
    line-height: 1.5;
}

.info {
    display: flex;
    justify-content: space-between;
    color: #aeb4c0;
    margin: 15px 0;
}

.download {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.download:hover {
    background: #4752c4;
}

footer {
    text-align: center;
    padding: 40px 20px;
    margin-top: 50px;
    color: #777e8d;
}
</style>
</head>

<body>

<header>
    <h1>TXTHub</h1>
    <div style="position:absolute; top:20px; right:20px;">
    <button onclick="openAuth()">
        Zaloguj / Rejestracja
    </button>
    </div>
    <p>Darmowa biblioteka plików TXT</p>
</header>

<div class="search">
    <input
        type="text"
        id="searchInput"
        placeholder="Szukaj plików..."
        oninput="searchFiles()"
    >
</div>

<main class="container">

<h2>Najnowsze pliki</h2>

<div class="files" id="fileList">

<div class="card">
    <h3>Better Bed Wars</h3>

    <p>
        Testowy plik Better Bed Wars dostępny do pobrania.
    </p>

    <div class="info">
        <span>🥔 5.0</span>
        <span>⬇️ 0 pobrań</span>
    </div>

    <a
        class="download"
        href="Better%20Bed%20Wars.zip"
        download
    >
        ⬇️ Pobierz
    </a>
</div>

</div>

</main>

<footer>
    © 2026 TXTHub
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://snaawhnhclbknsnzfgso.supabase.co";

const SUPABASE_KEY = "sb_publishable_KTpFHE2I5ckUF_mJ9s8HXg__DMYSRdh";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function searchFiles() {
    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const cards =
        document.querySelectorAll(".card");

    cards.forEach(card => {
        const text =
            card.innerText.toLowerCase();

        card.style.display =
            text.includes(search)
            ? "block"
            : "none";
    });
}
</script>

</body>
</html>
